[include mainsail.cfg]
[include m600.cfg]
[include TEST_SPEED.cfg]

[exclude_object]

#####################################################################
# 	MCU and printer settings
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AG0K6Y0H-if00-port0

[mcu CR4p2p2]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor CR4p2p2_temp]
sensor_type: temperature_mcu
sensor_mcu: CR4p2p2
min_temp: 0
max_temp: 100

[virtual_sdcard]
path: /home/owner/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2500
max_z_velocity: 10
max_z_accel: 100

#####################################################################
# 	X Stepper Settings
#####################################################################
[stepper_x]
step_pin: CR4p2p2:PC2
dir_pin: CR4p2p2:PB9
enable_pin: !CR4p2p2:PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^CR4p2p2:PA5
position_endstop: 350
position_max: 350
homing_speed: 50

#####################################################################
# 	Y Stepper Settings
#####################################################################
[stepper_y]
step_pin: CR4p2p2:PB8
dir_pin: CR4p2p2:PB7
enable_pin: !CR4p2p2:PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^CR4p2p2:PA6
position_endstop: 350
position_min: 0
position_max: 350
homing_speed: 50

#####################################################################
# 	Z Stepper Settings
#####################################################################
[stepper_z]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 400
position_min: -5.0
homing_speed: 3

[stepper_z1]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 8

#####################################################################
# 	Extruder Settings
#####################################################################
[extruder]
max_extrude_only_distance: 400.0
max_extrude_only_distance: 1000.0
step_pin: CR4p2p2:PB4
dir_pin: !CR4p2p2:PB3
enable_pin: !CR4p2p2:PC3
microsteps: 32
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: CR4p2p2:PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: CR4p2p2:PC5
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 300

#####################################################################
# 	Probe Sensor
#####################################################################
[bltouch]
sensor_pin: ^CR4p2p2:PB1
control_pin: CR4p2p2:PB0
x_offset: -45
y_offset: 0
z_offset: 0
speed: 3.0
#pin_up_touch_mode_reports_triggered: False

[safe_z_home]
home_xy_position: 180, 180
speed: 50
z_hop: 10
z_hop_speed: 5

#####################################################################
# 	Bed Settings
#####################################################################
[bed_mesh]
speed: 100
horizontal_move_z: 8
mesh_min: 20, 20
mesh_max: 300, 300
probe_count: 10, 10
algorithm: bicubic

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: pid
pid_Kp: 690.34
pid_Ki: 111.47
pid_Kd: 1068.83
min_temp: 0
max_temp: 130

#####################################################################
# 	Fan Settings
#####################################################################
[fan]
pin: PH6

#hotend fan
[heater_fan hotend_fan0]
# connected to Fan0 on Manta board
pin: CR4p2p2:PA0
heater: extruder
heater_temp: 50.0

#####################################################################
# 	Filament Settings
#####################################################################
#[filament_switch_sensor filament_sensor]
#switch_pin:PE4

[filament_switch_sensor filament_sensor]
pause_on_runout: True
runout_gcode:
  M25
  M117 No Filament
  M118 Filament runout
switch_pin: !PA4


#####################################################################
# 	Display Settings
#####################################################################
[display]
lcd_type: st7920
cs_pin: PH1
sclk_pin: PA1
sid_pin: PH0
encoder_pins: ^PA3, ^PA5
click_pin: ^!PC2